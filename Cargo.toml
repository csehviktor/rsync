[package]
name = "rsync"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "1.1.4"
